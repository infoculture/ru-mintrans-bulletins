[project]
name = "mintrans-stats"
version = "0.2.0"
description = "Бюллетень «Транспорт России» с сайта Минтранса России: парсер и база DuckDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ivan Begtin", email = "ibegtin@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=2.0.0",
    "httpx[socks]>=0.27",
    "lxml>=5.0",
    "olefile>=0.47",
    "pdfplumber>=0.11",
]

[project.urls]
Repository = "https://github.com/infoculture/ru-mintrans-bulletins"

[project.scripts]
mintrans-stats = "mintrans_stats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mintrans_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: тесты, которые ходят на mintrans.gov.ru (нужен российский IP или MINTRANS_PROXY)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма для проекта
